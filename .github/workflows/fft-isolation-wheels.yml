name: Build pinned FFT isolation wheels for local CPU benchmarks

on:
  push:
    branches: [bench/fft-local-isolation-20261105]
    paths: [.github/workflows/fft-isolation-wheels.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: GCC multiarch CPython 3.13 / ${{ matrix.variant.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: upstream
            sha: 757145c328d4680fc23bf37e372860fa49c4d8b5
          - name: lanes
            sha: 69aa1c1f5d2dbf3bd94915ee5aa9746cc179c44a
          - name: long
            sha: 1f0b78a5309cce83325c90db2dd1
          - name: combined
            sha: f80b987891bd34d367c414dc2f27a13e42f4cb94
    env:
      DUCC0_OPTIMIZATION: multiarch-strip
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build isolated wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p dist
          python -m pip wheel --no-cache-dir --no-deps -w dist .
          cat > dist/source.json <<JSON
          {"variant":"${{ matrix.variant.name }}","sha":"${{ matrix.variant.sha }}","optimization":"multiarch-strip"}
          JSON
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fft-isolation-wheel-${{ matrix.variant.name }}
          path: dist/
          retention-days: 7
