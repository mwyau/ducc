name: Validate FFT multiarch plan factory linkage

on:
  push:
    branches:
      - fix/fft-multiarch-make-pass-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fft-multiarch-linkage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DUCC0_OPTIMIZATION: multiarch-strip
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip 'scikit-build-core<1.1' 'pybind11>=2.13.6' cmake ninja numpy scipy pytest
      - name: Build the actual multiarch wheel
        run: python -m pip install --no-build-isolation --no-cache-dir .
      - name: Import and identify multiarch profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python python/test/check_multiarch.py --require-multiarch
          python - <<'PY' | tee validation/environment.txt
          import ducc0
          from pathlib import Path
          print("ducc0:", Path(ducc0.__file__).resolve())
          print("wrapper:", ducc0.__wrapper__)
          print("highest usable PSABI:", ducc0.misc.psabi_level())
          PY
      - name: Check forced v1, v3, v4 imports and FFT correctness
        shell: bash
        run: |
          set -euo pipefail
          max_usable="$(python -c 'import ducc0; print(ducc0.misc.psabi_level())')"
          for level in 1 3 4; do
            if (( level > max_usable )); then
              echo "SKIP v${level}: unsupported by this runner" | tee "validation/v${level}.txt"
              continue
            fi
            export DUCC0_MAX_PSABI_LEVEL="$level"
            python - <<'PY' | tee "validation/v${level}.txt"
          import ducc0, os
          requested=int(os.environ["DUCC0_MAX_PSABI_LEVEL"])
          active=ducc0.misc.psabi_level()
          print("requested:", requested, "active:", active, "module:", ducc0.__file__)
          assert active == requested, (requested, active)
          PY
            python -m pytest python/test/test_fft.py -q -x 2>&1 | tee -a "validation/v${level}.txt"
          done
      - name: Upload linkage validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-multiarch-linkage-validation
          path: validation/
          if-no-files-found: warn
          retention-days: 14
