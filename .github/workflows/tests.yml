name: ducc-simd-tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: d2f74d3803df568b0ce2df6e0094628b5aabe793

jobs:
  windows-avx:
    name: Windows 2025 / AVX
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build, test, and benchmark AVX plus SSE3/SSE2 reduction paths
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ci/run_windows_simd.ps1 -Isa avx

  windows-avx512:
    name: Windows 2025 / AVX-512
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build, test, and benchmark both AVX-512 SHT reductions
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ci/run_windows_simd.ps1 -Isa avx512
