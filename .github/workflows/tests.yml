# Branch-specific native AArch64 validation for the ARM64 multiarch dispatcher.
# The hosted ubuntu-24.04-arm runner is expected to expose NEON, SVE and SVE2.
name: arm64-multiarch-tests

on:
  push:
    branches:
      - feat/arm64-multiarch
    paths-ignore:
      - '.github/workflows/arm64_fft_bench.yml'
      - '.github/scripts/arm64_fft_bench.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-multiarch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-arm64:
    name: ARM64 / Python ${{ matrix.python }} / ${{ matrix.binding }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            binding: pybind11
          - python: '3.11'
            binding: nanobind
          - python: '3.14'
            binding: pybind11
          - python: '3.14'
            binding: nanobind
          - python: '3.14t'
            binding: nanobind
    env:
      DUCC0_OPTIMIZATION: multiarch
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Require native ARM64 with NEON, SVE and SVE2
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          lscpu
          features="$(grep -m1 '^Features' /proc/cpuinfo)"
          echo "$features"
          for feature in asimd sve sve2; do
            if [[ " $features " != *" $feature "* ]]; then
              echo "::error::Runner lacks required $feature hardware capability"
              exit 1
            fi
          done
          g++ --version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy

      - name: Build ARM64 multibuild from this checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.binding }}" == "nanobind" ]]; then
            DUCC0_USE_NANOBIND=1 python -m pip install --no-cache-dir -v .
          else
            python -m pip install --no-cache-dir -v .
          fi

      - name: Verify compiled variants, host capabilities and default dispatch
        shell: bash
        env:
          EXPECTED_BINDING: ${{ matrix.binding }}
        run: |
          python - <<'PY'
          import os
          import ducc0
          info = ducc0.misc.cpu_info()
          print("binding:", ducc0.__wrapper__)
          print("cpu_info:", info)
          assert ducc0.__wrapper__ == os.environ["EXPECTED_BINDING"]
          assert info["architecture"] == "aarch64"
          assert info["multiarch"] is True
          assert {"neon", "sve", "sve2"} <= set(info["features"])
          expected = ["neon", "sve", "sve2"]
          assert info["compiled_profiles"] == expected, info
          assert info["available_profiles"] == expected, info
          assert info["configured_limit"] == "sve2", info
          assert info["active_profile"] == "sve2", info
          PY

      - name: Test native NEON, SVE and SVE2 dispatch and full numerical suite
        shell: bash
        run: |
          set -euo pipefail
          for profile in neon sve sve2; do
            echo "::group::Native ARM64 profile: $profile"
            DUCC0_MAX_ARM_PROFILE="$profile" EXPECTED_PROFILE="$profile" python - <<'PY'
          import os
          import ducc0
          info = ducc0.misc.cpu_info()
          assert info["active_profile"] == os.environ["EXPECTED_PROFILE"], info
          assert info["configured_limit"] == os.environ["EXPECTED_PROFILE"], info
          assert info["compiled_profiles"] == ["neon", "sve", "sve2"], info
          print(info)
          PY
            DUCC0_MAX_ARM_PROFILE="$profile" python -m pytest -x -q python/test
            echo "::endgroup::"
          done

      - name: Run native C++ selector unit tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Ipython             test/test_multiarch.cc python/multiarch.cc             -o /tmp/ducc-test-multiarch
          /tmp/ducc-test-multiarch

      - name: Probe experimental SIMD types at every ARM ISA target
        shell: bash
        run: |
          set -euo pipefail
          for profile in neon sve sve2; do
            case "$profile" in
              neon) flags=(-march=armv8-a) ;;
              sve) flags=(-march=armv8-a+sve -msve-vector-bits=scalable) ;;
              sve2) flags=(-march=armv8-a+sve2 -msve-vector-bits=scalable) ;;
            esac
            g++ -std=c++17 -O3 "${flags[@]}"               test/arm64_simd_probe.cc -o "/tmp/ducc-simd-$profile"
            echo "::group::SIMD probe: $profile"
            "/tmp/ducc-simd-$profile"
            objdump -d --disassemble=ducc_simd_probe "/tmp/ducc-simd-$profile"               > "/tmp/ducc-simd-$profile.asm"
            grep -E '(fmla|ptrue|whilelo|ld1d|st1d)'               "/tmp/ducc-simd-$profile.asm" | head -n 12 || true
            echo "::endgroup::"
          done

  qemu-neon-fallback:
    name: ARM64 / QEMU Cortex-A76 (no SVE)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      DUCC0_OPTIMIZATION: multiarch
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install QEMU and Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-aarch64 --version
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy

      - name: Build combined ARM64 extension with pybind11
        run: python -m pip install --no-cache-dir -v .

      - name: Verify binary imports on emulated NEON-only CPU
        shell: bash
        run: |
          set -euo pipefail
          export DUCC0_MAX_ARM_PROFILE=sve2
          qemu-aarch64 -cpu cortex-a76 "$(command -v python)" - <<'PY'
          import ducc0
          info = ducc0.misc.cpu_info()
          print(info)
          assert info["architecture"] == "aarch64"
          assert info["multiarch"] is True
          assert "neon" in info["features"]
          assert "sve" not in info["features"]
          assert "sve2" not in info["features"]
          assert info["active_profile"] == "neon"
          PY

      - name: Run selector and FFT regression tests under QEMU
        shell: bash
        run: |
          set -euo pipefail
          DUCC0_MAX_ARM_PROFILE=sve2             qemu-aarch64 -cpu cortex-a76 "$(command -v python)"             -m pytest -q -x python/test/test_multiarch.py python/test/test_fft.py

  # Single-target builds run via QEMU in Docker so no paid SVE256/512 hardware
  # is needed; do not interpret emulated timings as hardware benchmarks.
  qemu-sve-docker:
    name: Docker QEMU / ${{ matrix.isa }} / ${{ matrix.bits }}-bit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: sve
            bits: 256
          - isa: sve
            bits: 512
          - isa: sve2
            bits: 256
          - isa: sve2
            bits: 512
    steps:
      - uses: actions/checkout@v7

      - name: Build with GCC 15 and validate fixed-width SVE under QEMU
        shell: bash
        env:
          TARGET_ISA: ${{ matrix.isa }}
          TARGET_BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          docker pull ubuntu:26.04
          docker run --rm --platform linux/arm64 \
            -e TARGET_ISA -e TARGET_BITS \
            -e CI=1 -e PYTHONUNBUFFERED=1 \
            -v "$PWD:/checkout:ro" \
            ubuntu:26.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc-15 g++-15 cmake ninja-build python3-dev python3-venv \
                python3-pip qemu-user ca-certificates
              test "$(uname -m)" = "aarch64"
              g++-15 --version
              qemu-aarch64 --version

              # Read-only checkout; build and install inside /tmp.
              cp -a /checkout /tmp/ducc-source
              cd /tmp/ducc-source
              python3 -m venv /tmp/ducc-sve-env
              . /tmp/ducc-sve-env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install \
                "scikit-build-core>=1.0,<1.1" pybind11 nanobind numpy

              export CC=gcc-15 CXX=g++-15
              export CMAKE_BUILD_PARALLEL_LEVEL=2
              export DUCC0_OPTIMIZATION=native
              export DUCC0_CFLAGS="-march=armv8-a+${TARGET_ISA} -msve-vector-bits=${TARGET_BITS}"

              # Fail fast on invalid emulation parameters, before the long
              # whole-module DUCC build. QEMU user-mode max already exposes
              # SVE2; sve2=on/off is not a supported -cpu max property.
              cpu="max,sve${TARGET_BITS}=on,sve-default-vector-length=$((TARGET_BITS / 8))"
              expected_sve2=0
              if [ "$TARGET_ISA" = "sve2" ]; then
                expected_sve2=1
              fi
              expected_lanes=$((TARGET_BITS / 64))
              g++-15 -std=c++17 -O3 \
                -march="armv8-a+${TARGET_ISA}" \
                -msve-vector-bits="${TARGET_BITS}" \
                test/arm64_simd_probe.cc -o /tmp/ducc-sve-probe
              probe_out="$(qemu-aarch64 -cpu "$cpu" /tmp/ducc-sve-probe)"
              printf "%s\n" "$probe_out"
              printf "%s\n" "$probe_out" | grep -q \
                "backend=SVE lanes=${expected_lanes} sve_target=1 sve_bits=${TARGET_BITS} sve2_target=${expected_sve2}"

              # Fixed-width SVE is NOT used for portable multibuild wheels.
              python -m pip install --no-cache-dir --no-build-isolation \
                --no-deps -v .

              # Real ISA/VL checks plus FFT, SHT, NUFFT, wgridder smoke tests.
              qemu-aarch64 -cpu "$cpu" /tmp/ducc-sve-env/bin/python \
                .github/scripts/arm64_sve_qemu_smoke.py \
                --isa "$TARGET_ISA" --bits "$TARGET_BITS"
            '
