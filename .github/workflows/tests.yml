name: numpy-fft-avx512-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-windows:
    runs-on: windows-2025
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Require AVX-512
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'CPUCapabilities.exe'
          $object = Join-Path $env:RUNNER_TEMP 'CPUCapabilities.obj'
          cl /nologo /EHsc /std:c++17 "/Fo:$object" "/Fe:$probe" cmake/CPUCapabilities.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $capabilities = ((& $probe) -join ' ').Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $capabilities

          if ($capabilities -notmatch '(^|\s)avx512_usable=1(\s|$)') {
            throw "This benchmark requires a runner with usable AVX-512. $capabilities"
          }

          @(
            '### Windows AVX-512 benchmark runner'
            "- CPU: $((Get-CimInstance Win32_Processor)[0].Name)"
            "- CPUCapabilities: $capabilities"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Benchmark NumPy-required DUCC FFT kernels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip numpy

          $avxDir = Join-Path $env:RUNNER_TEMP 'ducc-avx'
          $avx512Dir = Join-Path $env:RUNNER_TEMP 'ducc-avx512'
          $avxJson = Join-Path $env:RUNNER_TEMP 'fft-avx.json'
          $avx512Json = Join-Path $env:RUNNER_TEMP 'fft-avx512.json'

          $env:DUCC0_OPTIMIZATION = 'native-strip'
          $env:DUCC0_CFLAGS = '/DDUCC0_NO_FFT_CACHE /DDUCC0_NO_LOWLEVEL_THREADING'

          python -m pip install --no-cache-dir --no-deps --target $avxDir . `
            "--config-settings=cmake.define.DUCC0_ARCH_FLAGS=/arch:AVX"

          python -m pip install --no-cache-dir --no-deps --target $avx512Dir . `
            "--config-settings=cmake.define.DUCC0_ARCH_FLAGS=/arch:AVX512"

          $env:PYTHONPATH = $avxDir
          python .github/benchmarks/numpy_fft.py run --label avx --output $avxJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:PYTHONPATH = $avx512Dir
          python .github/benchmarks/numpy_fft.py run --label avx512 --output $avx512Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item Env:PYTHONPATH
          python .github/benchmarks/numpy_fft.py compare --avx $avxJson --avx512 $avx512Json

  benchmark-ubuntu:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Require AVX-512
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/CPUCapabilities"
          c++ -std=c++17 -O0 cmake/CPUCapabilities.cpp -o "$probe"
          capabilities="$("$probe")"
          echo "$capabilities"

          if [[ ! " $capabilities " =~ [[:space:]]avx512_usable=1[[:space:]] ]]; then
            echo "This benchmark requires a runner with usable AVX-512." >&2
            exit 1
          fi

          cpu_model="$(lscpu | awk -F: '$1 == "Model name" {sub(/^[[:space:]]*/, "", $2); print $2; exit}')"
          {
            echo '### Ubuntu AVX-512 benchmark runner'
            echo "- CPU: $cpu_model"
            echo "- CPUCapabilities: $capabilities"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark NumPy-required DUCC FFT kernels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip numpy

          avx_dir="$RUNNER_TEMP/ducc-avx"
          avx512_dir="$RUNNER_TEMP/ducc-avx512"
          avx_json="$RUNNER_TEMP/fft-avx.json"
          avx512_json="$RUNNER_TEMP/fft-avx512.json"

          export DUCC0_OPTIMIZATION=native-strip
          export DUCC0_CFLAGS='-DDUCC0_NO_FFT_CACHE -DDUCC0_NO_LOWLEVEL_THREADING'

          python -m pip install --no-cache-dir --no-deps --target "$avx_dir" . \
            --config-settings=cmake.define.DUCC0_ARCH_FLAGS=-mavx

          python -m pip install --no-cache-dir --no-deps --target "$avx512_dir" . \
            --config-settings=cmake.define.DUCC0_ARCH_FLAGS=-mavx512f

          PYTHONPATH="$avx_dir" \
            python .github/benchmarks/numpy_fft.py run --label avx --output "$avx_json"

          PYTHONPATH="$avx512_dir" \
            python .github/benchmarks/numpy_fft.py run --label avx512 --output "$avx512_json"

          python .github/benchmarks/numpy_fft.py compare \
            --avx "$avx_json" --avx512 "$avx512_json"
