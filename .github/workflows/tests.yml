name: ducc-tests

on:
  workflow_dispatch:
  push:
    branches:
      - fft-runtime-dispatch

jobs:
  test:
    name: ${{ matrix.runner }} / dispatch / V4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DUCC0_OPTIMIZATION: dispatch
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest numpy scipy

      - name: Show clang-cl
        if: runner.os == 'Windows'
        run: clang-cl --version

      - name: Build and install dispatch wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CXX = "clang-cl"
          python -m pip install --no-deps -v .

      - name: Build and install dispatch wheel
        if: runner.os != 'Windows'
        run: python -m pip install --no-deps -v .

      - name: Verify V4 dispatch
        run: >-
          python -c "import ducc0;
          info=ducc0.misc.cpu_info();
          print(info);
          assert info['fft']['compiled'] == ['x86-64', 'x86-64-v3', 'x86-64-v4'];
          assert info['usable_level'] == 'x86-64-v4';
          assert info['fft']['selected'] == 'x86-64-v4'"

      - name: Run CPU dispatch tests
        run: python -m pytest -q python/test/test_cpu_dispatch.py

      - name: Run FFT dispatch equivalence tests
        run: python -m pytest -q python/test/test_fft_dispatch.py

      - name: Run full Python test suite
        run: python -m pytest -q python/test -x

      - name: Benchmark FFT dispatch profiles
        run: >-
          python .github/scripts/fft_dispatch_bench.py
          --label ${{ matrix.runner }}
