name: Verify simplified FFT SIMD improvements

on:
  push:
    branches:
      - bench/fft-simd-verify-20261104
    paths:
      - .github/workflows/fft-simd-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-fft:
    name: FFT / ${{ matrix.optimization }} / cache ${{ matrix.cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        optimization: [portable, multiarch-strip]
        cache: [enabled, disabled]
    env:
      DUCC0_OPTIMIZATION: ${{ matrix.optimization }}
      CXXFLAGS: ${{ matrix.cache == 'disabled' && '-DDUCC0_NO_FFT_CACHE' || '' }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
      - name: Compile DUCC and install
        run: python -m pip install --no-cache-dir .
      - name: Run FFT round-trip tests on supported ABI levels
        shell: bash
        run: |
          set -euo pipefail
          for level in 1 3 4; do
            if DUCC0_MAX_PSABI_LEVEL="$level" python - "$level" <<'PY'
          import sys
          import ducc0
          requested = int(sys.argv[1])
          actual = int(ducc0.misc.psabi_level())
          print(f"request=v{requested}; actual=v{actual}")
          sys.exit(0 if actual == requested else 1)
          PY
            then
              echo "Testing active x86-64-v$level"
              DUCC0_MAX_PSABI_LEVEL="$level" \
                python -m pytest -q python/test/test_fft.py -x
            else
              echo "Skipping unsupported x86-64-v$level"
            fi
          done

  cpp-fft:
    name: C++ FFT tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run C++ unit tests
        run: ./test/run.sh
