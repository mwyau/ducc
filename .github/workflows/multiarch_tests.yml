name: ducc-multiarch-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  profiles:
    runs-on: ubuntu-24.04
    env:
      DUCC0_OPTIMIZATION: multiarch-strip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies and multiarch build
        run: |
          python -m pip install --user pytest numpy scipy
          python -m pip install --user .
      - name: Detect available CPU profiles
        id: cpu
        run: |
          lscpu | grep -E 'Architecture:|Model name:|Flags:' || true
          python - <<'PY'
          import json
          import os
          import ducc0
          info = ducc0.misc.cpu_info()
          print(json.dumps(info, indent=2))
          assert info["architecture"] == "x86-64" and info["multiarch"], info
          assert info["compiled_profiles"] == ["x86-64", "x86-64-v3", "x86-64-v4"], info
          available = info["available_profiles"]
          assert available and available[0] == "x86-64", info
          assert info["active_profile"] == available[-1], info
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for level in (3, 4):
                  supported = f"x86-64-v{level}" in available
                  print(f"v{level}={str(supported).lower()}", file=out)
                  if not supported:
                      print(f"SKIP v{level}: unsupported by runner CPU")
          PY
      - name: Full Python tests / v1
        env:
          DUCC0_MAX_PSABI_LEVEL: '1'
        run: |
          python -c 'import ducc0; assert ducc0.misc.cpu_info()["active_profile"] == "x86-64"'
          python -m pytest python/test -x
      - name: Full Python tests / v3
        if: steps.cpu.outputs.v3 == 'true'
        env:
          DUCC0_MAX_PSABI_LEVEL: '3'
        run: |
          python -c 'import ducc0; assert ducc0.misc.cpu_info()["active_profile"] == "x86-64-v3"'
          python -m pytest python/test -x
      - name: Full Python tests / v4
        if: steps.cpu.outputs.v4 == 'true'
        env:
          DUCC0_MAX_PSABI_LEVEL: '4'
        run: |
          python -c 'import ducc0; assert ducc0.misc.cpu_info()["active_profile"] == "x86-64-v4"'
          python -m pytest python/test -x
