name: Verify four-wide FFT plan upper-bound candidate

on:
  push:
    branches: [test/fft-fourwide-upper-bound-20261105]
    paths: [.github/workflows/fft-fourwide-bound-wheel.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build GCC multiarch wheel and FFT correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DUCC0_OPTIMIZATION: multiarch-strip
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test candidate wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
          mkdir -p dist
          python -m pip wheel --no-cache-dir --no-deps -w dist .
          python -m pip install --no-deps dist/ducc0-*.whl
          for level in 1 3 4; do
            if DUCC0_MAX_PSABI_LEVEL="$level" python - "$level" <<'PY'
          import ducc0,sys
          sys.exit(0 if ducc0.misc.psabi_level() == int(sys.argv[1]) else 1)
          PY
            then
              DUCC0_MAX_PSABI_LEVEL="$level" python -m pytest python/test/test_fft.py -q -x
            fi
          done
          python - <<'PY'
          import ducc0
          print('wheel=',ducc0.__file__, 'psabi=',ducc0.misc.psabi_level())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fft-fourwide-bound-wheel
          path: dist/*.whl
          retention-days: 7
